<div class="month-selector d-flex align-items-center justify-content-center mb-4">
  <!-- Botón mes anterior -->
  <button class="icon-button" (click)="prevMonth()">
    <svg cIcon name="cil-chevron-left" size="custom" title="Flecha izquierda"></svg>
  </button>

  <!-- Mes y año -->
  <div class="mx-2 month-display">
    {{ selectedDate() | date:'MMMM':'':'es' | titlecase }} {{ selectedDate() | date:'yyyy' }}
  </div>

  <!-- Botón mes siguiente -->
  <button class="icon-button" (click)="nextMonth()">
    <svg cIcon name="cil-chevron-right" size="custom" title="Flecha derecha"></svg>
  </button>
</div>

<div class="cards-grid pt-2 mt-2">

  <app-card-info-admin [loading]="loading()" [error]="error()" [reservas]="reservasCompletadas()" [today]="selectedDate()"
    tittle="Reservas Confirmadas">
  </app-card-info-admin>

  <app-card-info-admin [loading]="loading()" [error]="error()" [reservas]="reservasPendientes()" [today]="selectedDate()"
    tittle="Reservas Pendientes">
  </app-card-info-admin>

  <app-card-info-admin [loading]="loading()" [error]="error()" [reservas]="reservasCanceladas()" [today]="selectedDate()"
    tittle="Reservas Canceladas">
  </app-card-info-admin>

  <app-card-info-admin [loading]="loading()" [error]="error()" [reservas]="reservasBloqueadas()" [today]="selectedDate()"
    tittle="Reservas Bloqueadas">
  </app-card-info-admin>
  <app-card-info-admin [loading]="loading()" [error]="error()" [reservas]="reservasRechazadas()" [today]="selectedDate()"
      tittle="Reservas Rechazadas">
  </app-card-info-admin>


</div>


<section class="charts-section mt-4">
  <h4 class="mb-3">Estado de reservas del mes</h4>

  @if (!loading() && !error()) {
  <div class="chart-list">
    @for (item of resumenEstados(); track item.key) {
    <div class="chart-row">
      <div class="chart-meta">
        <span>{{ item.key }}</span>
        <strong>{{ item.cantidad }}</strong>
      </div>
      <div class="chart-bar">
        <span class="chart-fill" [style.width.%]="item.porcentaje" [style.background]="item.color"></span>
      </div>
    </div>
    }
  </div>
  }
</section>
