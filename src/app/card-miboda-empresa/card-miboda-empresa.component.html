<a [routerLink]="['/proveedores/detalles', empresa()?.id]" class="text-decoration-none card-link">
  <mat-card class="example-card" appearance="outlined">
    <div class="card-cover">
      @if (empresa()?.fotos?.length) {
        <img [src]="empresa()?.fotos?.[0]?.url" alt="{{ empresa()?.nombre_empresa }}" class="cover-photo" />
      } @else {
        <i class="bi" [class]="'bi ' + iconoServicio()"></i>
      }
      <span class="tag">{{ badgeTexto() }}</span>
    </div>

    <mat-card-header>
      <div mat-card-avatar class="example-header-image">{{ iniciales() }}</div>
      <mat-card-title>
        <h6>{{ empresa()?.nombre_empresa }}</h6>
      </mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <p>{{ empresa()?.tipo_servicio }}</p>
      <small>{{ empresa()?.poblacion?.nombre }} · {{ empresa()?.provincia?.nombre }}</small>
    </mat-card-content>
  </mat-card>
</a>
