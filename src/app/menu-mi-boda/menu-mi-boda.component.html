<!-- Bootstrap 5 Navigation -->
<nav class="navbar bg-white shadow-sm mb-3 border-bottom py-4">
    <div class="container-fluid">
        <ul class="nav w-100 d-flex justify-content-evenly align-items-center ms-5 me-5">
            <li class="nav-item" *ngFor="let item of menuItems">
                <a class="nav-link text-center" [class.active]="router.url.includes(item.route)" (click)="irARuta(item.route, $event, item.fragment)">
                    <img [src]="item.icon" [alt]="item.label" width="40" height="40" class="mb-1">
                    <div>{{ item.label }}</div>
                </a>
            </li>
        </ul>
    </div>
</nav>
