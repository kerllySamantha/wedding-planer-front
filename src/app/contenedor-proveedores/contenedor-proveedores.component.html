<app-navbar></app-navbar>
<app-menu-mi-boda></app-menu-mi-boda>

<div class="container-personal">
    <!-- Botones Presupuesto / Pago -->
    <div class="row justify-content-center py-3">
        <div class="btn-group col-auto gap-2" role="group">
            <input type="radio" class="btn-check" name="btnradio" id="btnradio1" autocomplete="off"
                (change)="selectColor('presupuesto')" [checked]="!selectPago" />
            <label class="btn toggle-btn" [ngClass]="selectPago ? 'btn-unselected' : 'btn-selected'" for="btnradio1">
                Presupuesto
            </label>

            <input type="radio" class="btn-check" name="btnradio" id="btnradio2" autocomplete="off"
                (change)="selectColor('pago')" [checked]="selectPago" />
            <label class="btn toggle-btn" [ngClass]="selectPago ? 'btn-selected' : 'btn-unselected'" for="btnradio2">
                Pago
            </label>
        </div>
    </div>

    <!-- Contenedor principal -->
    <div class="row mt-4 gx-4 gy-3">
        <!-- Columna Categorías -->
        <div class="col-4">
            <ul class="list-group list-group-flush categoria-list">
                <li class="list-group-item d-flex align-items-center categoria-item categoria-add mb-2">
                    <i class="bi bi-plus-circle me-2"></i>
                    Categoría
                </li>
                @for (categoria of categorias$ | async; track categoria.id) {
                <li class="list-group-item categoria-item mb-2" [class.active]="categoria.id === idSelected()"
                    (click)="clickIdCategoria(categoria.id)">
                    <img [src]="categoria.icono" alt="" class="me-2">{{ categoria.nombre }}
                </li>
                }
            </ul>
        </div>

        <!-- Columna Presupuesto / Tipos -->
        <div class="col-8 p-3">
            <div class="container mb-3">
                <app-contenedor-presupuesto></app-contenedor-presupuesto>
            </div>
            <div class="container">
                <app-contenedor-tipos [categoriaIdSeleccionada]="idSelected()" [presupuestoId]="presupuestoId()">
                </app-contenedor-tipos>
            </div>
        </div>
    </div>
</div>
