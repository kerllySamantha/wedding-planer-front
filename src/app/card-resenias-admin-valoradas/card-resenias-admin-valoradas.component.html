<div class="card review-card h-100 rounded-4 mx-auto">
  <a href="#" class="text-decoration-none text-dark">

    @for (foto of resenia()?.fotos; track foto.path; let idx = $index) {
      @if (idx === 0) {
        <div class="position-relative overflow-hidden rounded-top-4">
          <img
            [src]="foto?.url"
            class="card-img-top review-img"
            [alt]="resenia()?.comentario">
        </div>
      }
    }

    <div class="card-body text-center d-flex flex-column">

      <h5 class="card-title mb-1 fw-semibold">
        {{ resenia()?.usuario?.name }}
      </h5>

      <p class="text-muted small mb-2">
        {{ resenia()?.fotos?.length }} Fotos
      </p>

      <div class="stars mb-2">
        @for (star of [].constructor(resenia()?.puntuacion); track $index) {
          <mat-icon>star</mat-icon>
        }
      </div>

      <p class="review-text mt-2">
        {{ resenia()?.comentario }}
      </p>

    </div>

  </a>
</div>
