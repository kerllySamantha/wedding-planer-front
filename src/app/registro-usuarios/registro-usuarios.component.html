<div class="fondo">
    <app-navbar></app-navbar>

    <div class="auth-wrapper d-flex justify-content-center align-items-center">
        <div class="row g-0 login-row">
            <div class="col-lg-5 image-fondo"></div>

            <div class="col-lg-7 column-login">
                <div class="login-content">
                    <h2 class="text-center mb-3">Registro</h2>
                    <p class="text-center text-muted mb-4">Completa tus datos para crear tu cuenta.</p>

                    <div id="error_email" class="alert alert-danger d-none">
                        La dirección de correo o la contraseña son incorrectas.
                    </div>

                    <form name="frmLogin" action="/com-Login.php" method="post">
                        <input type="hidden" id="urlR" name="urlR" value="">
                        <input type="hidden" name="isJsArchitectureEnabled" value="true">

                        <div class="field-group mb-3">
                            <label class="form-label" for="Login">Usuario</label>
                            <div class="input-group field-control">
                                <span class="input-group-text border-end-0 rounded-start-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person" viewBox="0 0 16 16">
                                        <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4" />
                                    </svg>
                                </span>
                                <input type="text" class="form-control border-start-0 rounded-end-2" placeholder="Tu usuario" name="Login" id="Login" required>
                            </div>
                        </div>

                        <div class="field-group mb-3">
                            <label class="form-label" for="email">Correo electrónico</label>
                            <div class="input-group field-control">
                                <span class="input-group-text border-end-0 rounded-start-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-envelope" viewBox="0 0 16 16">
                                        <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v.217l7 4.2 7-4.2V4a1 1 0 0 0-1-1zm13 2.383-4.708 2.825L15 11.105zm-.034 6.876-5.64-3.471L8 9.583l-1.326-.795-5.64 3.47A1 1 0 0 0 2 13h12a1 1 0 0 0 .966-.741M1 11.105l4.708-2.897L1 5.383z" />
                                    </svg>
                                </span>
                                <input type="email" class="form-control border-start-0 rounded-end-2" placeholder="correo@ejemplo.com" name="email" id="email" required>
                            </div>
                        </div>

                        <div class="field-group mb-3">
                            <label class="form-label" for="Password">Contraseña</label>
                            <div class="input-group field-control">
                                <span class="input-group-text border-end-0 rounded-start-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-key" viewBox="0 0 16 16">
                                        <path d="M0 8a4 4 0 0 1 7.465-2H14a.5.5 0 0 1 .354.146l1.5 1.5a.5.5 0 0 1 0 .708l-1.5 1.5a.5.5 0 0 1-.708 0L13 9.207l-.646.647a.5.5 0 0 1-.708 0L11 9.207l-.646.647a.5.5 0 0 1-.708 0L9 9.207l-.646.647A.5.5 0 0 1 8 10h-.535A4 4 0 0 1 0 8m4-3a3 3 0 1 0 2.712 4.285A.5.5 0 0 1 7.163 9h.63l.853-.854a.5.5 0 0 1 .708 0l.646.647.646-.647a.5.5 0 0 1 .708 0l.646.647.646-.647a.5.5 0 0 1 .708 0l.646.647.793-.793-1-1h-6.63a.5.5 0 0 1-.451-.285A3 3 0 0 0 4 5" />
                                    </svg>
                                </span>
                                <input id="Password" name="Password" type="password" class="form-control border-start-0 rounded-end-2" placeholder="Crea tu contraseña" autocomplete="off" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label" for="poblacion">Población</label>
                                <input id="poblacion" name="poblacion" type="text" class="form-control field-control" placeholder="Ciudad" autocomplete="off" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="pais">País</label>
                                <input id="pais" name="pais" type="text" class="form-control field-control" placeholder="País" autocomplete="off" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label" for="boda">Fecha de boda</label>
                                <input id="boda" name="boda" type="date" class="form-control field-control" autocomplete="off" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="telefono">Teléfono</label>
                                <input id="telefono" name="telefono" type="tel" class="form-control field-control" placeholder="Teléfono" autocomplete="off" required>
                            </div>
                        </div>

                        <fieldset class="novios mt-2 mb-4">
                            <legend class="form-label mb-2">Yo soy</legend>
                            <div class="d-flex flex-wrap gap-3">
                                <label for="novio" class="option-chip">
                                    <input type="radio" name="rol" id="novio" value="novio"> Novio
                                </label>
                                <label for="novia" class="option-chip">
                                    <input type="radio" name="rol" id="novia" value="novia"> Novia
                                </label>
                            </div>
                        </fieldset>

                        <div class="d-grid mb-4">
                            <button type="submit" class="btn submit-button btn-lg">Registrarme</button>
                        </div>

                        <p class="text-center mb-2">¿Eres profesional?</p>
                        <div class="text-center">
                            <a class="fw-bold" [routerLink]="['/dashboard-empresas']">Acceso para empresas</a>
                        </div>
                    </form>

                    <p class="text-center mt-4 mb-0">
                        ¿Ya dispones de cuenta?
                        <a [routerLink]="['/login']">Accede</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
