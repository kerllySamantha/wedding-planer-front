<form (submit)="$event.preventDefault()">

  @if (cargando()) {
    <div class="skeleton-wrapper">
      <div class="skeleton-row header">
        <div class="skeleton-cell skeleton" style="width: 30%"></div>
        <div class="skeleton-cell skeleton" style="width: 20%"></div>
        <div class="skeleton-cell skeleton" style="width: 20%"></div>
        <div class="skeleton-cell skeleton" style="width: 20%"></div>
      </div>
      @for (i of [1,2,3,4,5]; track i) {
        <div class="skeleton-row">
          <div class="skeleton-cell skeleton" style="width: 85%; height: 36px"></div>
          <div class="skeleton-cell skeleton" style="width: 85%; height: 36px"></div>
          <div class="skeleton-cell skeleton" style="width: 85%; height: 36px"></div>
          <div class="skeleton-cell skeleton" style="width: 50%; height: 36px"></div>
        </div>
      }
    </div>
  }

  @else if (categoriaIdSeleccionada() !== null) {
    <table class="table tipos-table">
      <thead>
        <tr>
          <th>Concepto</th>
          <th>Coste estimado</th>
          <th>Pagado</th>
          <th>Diferencia</th>
        </tr>
      </thead>
      <tbody>
        @for (detalle of (detallesPorCategoria()[categoriaIdSeleccionada()!] || []); track $index) {
          <tr class="tipo-row">
            <td>
              <input type="text"
                [(ngModel)]="detalle.nombre_tipo_personalizado"
                (ngModelChange)="detalle.es_personalizado = true; onDetalleChange(detalle)"
                name="nombre_tipo_{{detalle.tipo_producto_id}}"
                class="input-tipo" />
            </td>
            <td>
              <input type="number"
                [(ngModel)]="detalle.monto_estimado"
                (ngModelChange)="onDetalleChange(detalle)"
                [readonly]="!esMontoEstimadoEditable(detalle)"
                name="monto_estimado_{{detalle.tipo_producto_id}}"
                class="input-tipo input-numero"
                [class.readonly]="!esMontoEstimadoEditable(detalle)" />
            </td>
            <td>
              <input type="number"
                [(ngModel)]="detalle.monto_pagado"
                (ngModelChange)="onDetalleChange(detalle)"
                name="monto_pagado_{{detalle.tipo_producto_id}}"
                class="input-tipo input-numero" />
            </td>
            <td>
              <span class="diferencia-valor"
                [class.positivo]="calcularDiferencia(detalle) >= 0"
                [class.negativo]="calcularDiferencia(detalle) < 0">
                {{ calcularDiferencia(detalle) }} €
              </span>
            </td>
          </tr>
        }
      </tbody>
    </table>
  }

</form>
