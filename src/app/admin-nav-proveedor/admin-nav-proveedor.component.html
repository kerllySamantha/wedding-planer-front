
<div class="app-sidebar">
    <aside class="sidebar-shell">

        <!-- LOGO -->
        <header class="sidebar-brand">

            <span class="brand-mark">
                <i class="bi bi-buildings"></i>
            </span>

            <div class="brand-copy">
                <p class="eyebrow">Panel proveedor</p>
            </div>

        </header>

        <p class="section-title">Navegacion</p>

        <ul class="sidebar-nav">

            <!-- DASHBOARD -->
            <li class="nav-item" style="--item-index: 0;">

                <a class="nav-link"
                    [routerLink]="['/proveedor-dashboard']"
                    routerLinkActive="is-active"
                    [routerLinkActiveOptions]="{ exact: true }">

                    <span class="nav-icon">
                        <i class="bi bi-speedometer2"></i>
                    </span>

                    <span class="nav-copy">
                        <strong>Dashboard</strong>
                        <small>Resumen y actividad</small>
                    </span>

                </a>

            </li>

            <!-- CALENDARIO -->
            <li class="nav-item" style="--item-index: 1;">

                <a class="nav-link"
                    [routerLink]="['/proveedor-dashboard/calendar']"
                    routerLinkActive="is-active">

                    <span class="nav-icon">
                        <i class="bi bi-calendar3"></i>
                    </span>

                    <span class="nav-copy">
                        <strong>Calendario</strong>
                        <small>Eventos y disponibilidad</small>
                    </span>

                </a>

            </li>

            <!-- CONFIGURACION -->
            <li class="nav-item" style="--item-index: 2;">

                <a class="nav-link"
                    [routerLink]="['/proveedor-dashboard/configuracion']"
                    routerLinkActive="is-active">

                    <span class="nav-icon">
                        <i class="bi bi-gear"></i>
                    </span>

                    <span class="nav-copy">
                        <strong>Configuracion</strong>
                        <small>Ajustes del perfil</small>
                    </span>

                </a>

            </li>

            <!-- RESEÑAS -->
            <li class="nav-item" style="--item-index: 3;">

                <a class="nav-link"
                    [routerLink]="['/proveedor-dashboard/resenias']"
                    routerLinkActive="is-active">

                    <span class="nav-icon">
                        <i class="bi bi-star"></i>
                    </span>

                    <span class="nav-copy">
                        <strong>Reseñas</strong>
                        <small>Calificaciones de clientes</small>
                    </span>

                </a>

            </li>

            <!-- SOLICITUDES -->
            <li class="nav-item" style="--item-index: 4;">

                <a class="nav-link"
                    [routerLink]="['/proveedor-dashboard/solicitudes']"
                    routerLinkActive="is-active">

                    <span class="nav-icon">
                        <i class="bi bi-file-text"></i>
                    </span>

                    <span class="nav-copy">
                        <strong>Solicitudes</strong>
                        <small>Presupuestos de clientes</small>
                    </span>

                </a>

            </li>

        </ul>

    </aside>
</div>
