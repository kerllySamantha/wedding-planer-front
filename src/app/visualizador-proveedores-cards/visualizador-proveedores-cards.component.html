<mat-tab-group [(selectedIndex)]="selectedIndex" (selectedIndexChange)="onTabChange($event)">
    <mat-tab>
        <ng-template mat-tab-label><i class="bi bi-list me-2"></i> Listado</ng-template>
    </mat-tab>
    <mat-tab>
        <ng-template mat-tab-label><i class="bi bi-grid-3x3-gap me-2"></i> Imágenes</ng-template>
    </mat-tab>
    <mat-tab>
        <ng-template mat-tab-label><i class="bi bi-geo-alt me-2"></i> Mapa</ng-template>
    </mat-tab>
</mat-tab-group>
