<router-outlet></router-outlet>
<app-navbar></app-navbar>
<app-menu-mi-boda></app-menu-mi-boda>

<div class="page-content">

  <app-actividades-mi-boda></app-actividades-mi-boda>

  <!-- Cabecera sección — directamente sobre fondo #F0F4F8 -->
  <div class="sec-header">
    <div>
      <p class="sec-title">Crea tu equipo soñado</p>
      <p class="sec-sub">Lee las opiniones, guarda tus favoritos y contáctalos</p>
    </div>
    <span class="sec-badge">
      <i class="bi bi-building me-1"></i>
      {{ totalResultados() }} {{ totalResultados() === 1 ? 'proveedor' : 'proveedores' }}
    </span>
  </div>

  <!-- Fila de búsqueda -->
  <div class="search-row">
    <div class="sbox">
      <i class="bi bi-search sbox__icon"></i>
      <input class="sbox__input" type="text" placeholder="Buscar proveedor…"
          (input)="onNombreChange($event)">
    </div>

    <select #categoriaSelect class="fbox" id="categorias"
        (change)="onCategoriaChange($event)">
      <option value="" disabled selected>Todas las categorías</option>
      @for (categoria of categorias$ | async; track categoria.id) {
        <option [value]="categoria.id">{{ categoria.nombre }}</option>
      }
    </select>

    <button class="fbox fbox--coral" type="button" (click)="limpiarFiltros(categoriaSelect)">
      <i class="bi bi-arrow-counterclockwise me-1"></i>Limpiar
    </button>
  </div>

  <!-- Grid de proveedores -->
  <div class="provider-grid">
    @for (empresa of companies(); track empresa.id) {
      <app-card-miboda-empresa [empresa]="empresa"></app-card-miboda-empresa>
    }
  </div>

</div>
