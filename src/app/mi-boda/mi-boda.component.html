<router-outlet></router-outlet>
<app-navbar></app-navbar>
<app-menu-mi-boda></app-menu-mi-boda>

<div class="page-content">

  <app-actividades-mi-boda></app-actividades-mi-boda>

  <div class="sec-header mt-5">
    <div>
      <p class="sec-title">Crea tu equipo soñado</p>
      <p class="sec-sub">Lee las opiniones, guarda tus favoritos y contáctalos</p>
    </div>
    <!-- <span class="sec-badge">
      <i class="bi bi-building me-1"></i>
      {{ totalResultados() }} {{ totalResultados() === 1 ? 'proveedor' : 'proveedores' }}
    </span> -->
  </div>

  <div class="d-flex justify-content-end my-3">
    <div class="filter-group input-group shadow-sm">
      <select #categoriaSelect class="form-select fbox fbox--strong" id="categorias" (change)="onCategoriaChange($event)">
        <option value="" disabled selected>Filtrar por categoría</option>
        @for (categoria of categorias$ | async; track categoria.id) {
          <option [value]="categoria.id">{{ categoria.nombre }}</option>
        }
      </select>

      <button class="btn fbox fbox--coral fw-semibold" type="button" (click)="limpiarFiltros(categoriaSelect)">Limpiar</button>
    </div>
  </div>

  <div class="provider-grid">
    @if (cargandoEmpresas()) {
      @for (item of [1,2,3,4,5,6,7,8]; track item) {
        <div class="card skeleton-card" aria-hidden="true">
          <div class="placeholder-glow">
            <span class="placeholder skeleton-pink skeleton-cover col-12"></span>
            <div class="skeleton-body px-3 py-3">
              <span class="placeholder skeleton-pink col-8 mb-2"></span>
              <span class="placeholder skeleton-pink col-5 mb-2"></span>
              <span class="placeholder skeleton-pink col-10"></span>
            </div>
          </div>
        </div>
      }
    }

    @for (empresa of companies(); track empresa.id) {
      <app-card-miboda-empresa [empresa]="empresa"></app-card-miboda-empresa>
    }
  </div>

</div>
