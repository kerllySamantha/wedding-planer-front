<router-outlet></router-outlet>
<app-navbar></app-navbar>
<app-menu-mi-boda></app-menu-mi-boda>

<div class="container">
    <app-actividades-mi-boda></app-actividades-mi-boda>

    <div class="row">
        <h1>Crea tu equipo soñado</h1>
        <!-- ✅ Bootstrap 5: estructura responsive y alineación en una sola línea en md+ -->
        <div class="row justify-content-center align-items-center g-3">
            <!-- Texto: en móvil ocupa todo; en md ocupa menos para dejar espacio al select -->
            <p class="col-12 col-md-5 mb-0">
                Lee las opiniones, guarda tus favoritos y contáctalos
            </p>

            <!-- Select: en móvil ocupa todo; en md se alinea a la derecha en la misma fila -->
            <div class="col-12 col-md-6">
                <select class="form-select w-100" id="categorias" name="categoria" (change)="onCategoriaChange($event)">
                    <option value="" disabled selected>Seleccione una categoría</option>

                    @for (categoria of categorias$ | async; track categoria.id) {
                    <option [value]="categoria.id">
                        {{ categoria.nombre }}
                    </option>
                    }
                </select>
            </div>
        </div>


    </div>
</div>

<div class="personal-container">

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4">
        @for (empresa of companies(); track empresa.id) {
        <app-card-miboda-empresa [empresa]="empresa"></app-card-miboda-empresa>
        }

    </div>

</div>
