<div class="presupuesto-card">
    <h2 class="presupuesto-titulo">Mi presupuesto</h2>

    <div class="row g-0">
        <div class="col-4 stat-item">
            <div class="stat-icon">
                <i class="bi bi-piggy-bank"></i>
            </div>
            <p class="stat-label">Monto total</p>
            <p class="stat-value">{{ totalEstimado() | number:'1.2-2' }} €</p>
        </div>

        <div class="col-4 stat-item stat-item--middle">
            <div class="stat-icon">
                <i class="bi bi-cash-coin"></i>
            </div>
            <p class="stat-label">Pagado</p>
            <p class="stat-value stat-value--pagado">{{ totalPagado() | number:'1.2-2' }} €</p>
        </div>

        <div class="col-4 stat-item">
            <div class="stat-icon">
                <i class="bi bi-wallet2"></i>
            </div>
            <p class="stat-label">Restante</p>
            <p class="stat-value stat-value--restante">{{ totalRestante() | number:'1.2-2' }} €</p>
        </div>
    </div>
</div>
