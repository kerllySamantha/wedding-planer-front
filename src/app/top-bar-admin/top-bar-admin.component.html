<nav class="navbar navbar-expand-xl bg-body-tertiary shadow-sm fixed-top">
  <div class="container-fluid">
    <button class="navbar-toggler" (click)="onHamburgerClick()">
      <span class="navbar-toggler-icon"></span>
    </button>

    <span class="navbar-brand d-none d-xl-block">{{ nombreEmpresa() }}</span>

    <div class="d-flex align-items-center gap-3">
      <button class="btn btn-light topbar-icon-btn btn-chat" type="button" aria-label="Mensajes">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          fill="currentColor"
          class="bi bi-chat-dots-fill"
          viewBox="0 0 16 16"
        >
          <path
            d="M16 8c0 3.866-3.582 7-8 7a9 9 0 0 1-2.347-.306c-.584.296-1.925.864-4.181 1.234-.2.032-.352-.176-.273-.362.354-.836.674-1.95.77-2.966C.744 11.37 0 9.76 0 8c0-3.866 3.582-7 8-7s8 3.134 8 7M5 8a1 1 0 1 0-2 0 1 1 0 0 0 2 0m4 0a1 1 0 1 0-2 0 1 1 0 0 0 2 0m3 1a1 1 0 1 0 0-2 1 1 0 0 0 0 2"
          />
        </svg>
      </button>

      <button class="btn btn-light topbar-icon-btn" type="button" aria-label="Notificaciones">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          fill="currentColor"
          class="bi bi-bell"
          viewBox="0 0 16 16"
        >
          <path
            d="M8 16a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2M8 1.918l-.797.161A4 4 0 0 0 4 6c0 .628-.134 2.197-.459 3.742-.16.767-.376 1.566-.663 2.258h10.244c-.287-.692-.502-1.49-.663-2.258C12.134 8.197 12 6.628 12 6a4 4 0 0 0-3.203-3.92zM14.22 12c.223.447.481.801.78 1H1c.299-.199.557-.553.78-1C2.68 10.2 3 6.88 3 6c0-2.42 1.72-4.44 4.005-4.901a1 1 0 1 1 1.99 0A5 5 0 0 1 13 6c0 .88.32 4.2 1.22 6"
          />
        </svg>
      </button>

      <div class="dropdown user-dropdown">
        <button [matMenuTriggerFor]="menu" class="btn btn-light topbar-icon-btn profile-btn" type="button" aria-label="Perfil">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            class="bi bi-person-circle"
            viewBox="0 0 16 16"
          >
            <path
              d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"
            />
            <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
          </svg>
        </button>

        <mat-menu #menu="matMenu" class="custom-dropdown-menu" xPosition="before">
          <div class="menu-header">
            <span class="menu-company">{{ nombreEmpresa() }}</span>
            <small class="menu-subtitle">Cuenta de proveedor</small>
          </div>

          <div class="menu-divider"></div>

          <button mat-menu-item class="menu-item-logout" (click)="logout()">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="currentColor" class="bi bi-box-arrow-right" viewBox="0 0 16 16">
              <path fill-rule="evenodd" d="M6 3a2 2 0 0 0-2 2v1a.5.5 0 0 0 1 0V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-1a.5.5 0 0 0-1 0v1a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/>
              <path fill-rule="evenodd" d="M.146 8.354a.5.5 0 0 1 0-.708l2-2a.5.5 0 1 1 .708.708L1.707 7.5H8.5a.5.5 0 0 1 0 1H1.707l1.147 1.146a.5.5 0 0 1-.708.708z"/>
            </svg>
            <span>Cerrar sesion</span>
          </button>
        </mat-menu>
      </div>
    </div>
  </div>
</nav>

<div id="adminSidebar" class="offcanvas offcanvas-start custom-offcanvas" [class.show]="sidebarOpen()">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title">{{ nombreEmpresa() }}</h5>
    <button type="button" class="btn-close" (click)="toggleSidebar()"></button>
  </div>

  <div class="offcanvas-body">
    <app-admin-nav-proveedor></app-admin-nav-proveedor>
  </div>
</div>
