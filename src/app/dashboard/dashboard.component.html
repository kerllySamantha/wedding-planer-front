<app-navbar></app-navbar>
<hr>

<div class="container-fluid tittle-header border-bottom pb-3">
    <div class="row justify-content-lg-start justify-content-center text-center text-lg-start">
        <div class="col-12 col-lg-6 offset-lg-1">
            <h1 class="pt-4 mt-4 mb-3 pb-3 w-100">
                Para tu boda,<br class="d-none d-lg-block" />
                aquí lo tienes todo
            </h1>

            <form
                class="d-flex flex-column flex-sm-row align-items-center justify-content-center justify-content-lg-start gap-2 w-100"
                role="search">
                <input class="form-control searcher_input w-100 w-md-75 w-lg-100" type="search"
                    placeholder="Busca por nombre o categoría" aria-label="Search" />
                <button class="btn btn-outline-success d-none d-sm-inline-block searcher__submit"
                    type="submit">Buscar</button>
            </form>
        </div>
    </div>
</div>

<div class="container">

    <app-card-actividades-novia></app-card-actividades-novia>

    <h1 class="h1-tittle">Empresas</h1>
    <div class="row row-cols-1 row-cols-md-3 g-4">
        @for (empresa of empresas$(); track empresa.id) {
        <app-card-empresa [empresa]="empresa"></app-card-empresa>
        }
    </div>

    <h1 class="h1-tittle">Bodas Reales</h1>
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-5">
        @for (boda of bodas$(); track boda.id) {
        <app-card-boda [boda]="boda"></app-card-boda>
        }
    </div>
</div>
