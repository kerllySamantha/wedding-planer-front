<section class="calendar-page">
    <div class="calendar-inner" [class.fc-loading-skeleton]="loading()">
        <div class="calendar-wrapper">
            <full-calendar [options]="calendarOptions()"></full-calendar>
        </div>
    </div>

    <app-modal-calendar-form [data]="modalData" [event]="selectedEvent()" (editar)="modalMode.set('edit')"
        [mode]="modalMode()" (guardarReserva)="guardarReserva($event)" (cerrar)="cerrarModal()">
    </app-modal-calendar-form>
</section>
